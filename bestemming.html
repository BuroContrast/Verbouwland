<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verbouwland</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Manrope;background:#fbf2ec;color:#140438;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:55px;border-radius:22px;text-align:center;max-width:560px;box-shadow:0 20px 70px #4b079815}h1{font-size:38px}.logo{color:#4b0798;font-weight:800}.btn{display:inline-block;background:#4b0798;color:#fff;text-decoration:none;border-radius:7px;padding:13px 23px;font-weight:800;margin-top:20px}</style></head><body><main class="card"><div class="logo">⌄ Verbouwland</div><h1 id="title">Deze pagina komt eraan</h1><p id="message">De knop werkt en heeft je naar een aparte pagina gebracht. De inhoud van deze vervolgpagina kunnen we hierna samen ontwerpen.</p><a class="btn" href="index.html">Terug naar home</a></main><script>const p=new URLSearchParams(location.search);const page=p.get('pagina');if(page==='quickscan'){const postcode=p.get('postcode')||'';const nr=p.get('huisnummer')||'';document.querySelector('#title').textContent='Bedankt voor je aanvraag!';document.querySelector('#message').textContent=`We hebben je aanvraag ontvangen voor ${postcode} ${nr}. Dit is een demonstratie; er worden nog geen gegevens opgeslagen of verstuurd.`}</script></body></html>
